# NOTE: written but NOT executed in the environment where it was authored (no GitHub runners there).
# The same commands were run locally on Linux; Windows and macOS runs are unverified until this workflow runs.
name: ci
on: [push, pull_request]
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python benchmarks/bench.py
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: calyre-${{ matrix.os }}
          path: dist/calyre-*
